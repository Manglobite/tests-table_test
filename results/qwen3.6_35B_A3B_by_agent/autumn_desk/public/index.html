<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Осенний рабочий стол</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; }
    canvas { display: block; width: 100%; height: 100%; }
    #error-overlay {
      display: none; position: fixed; inset: 0; z-index: 1000;
      background: #1a1a1a; color: #f0e6d2; font-family: system-ui, sans-serif;
      flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
    }
    #error-overlay h1 { font-size: 1.5rem; margin-bottom: 1rem; }
    #error-overlay p { max-width: 500px; line-height: 1.6; }
  </style>
</head>
<body>
  <div id="error-overlay">
    <h1>WebGL не поддерживается</h1>
    <p>Ваш браузер не поддерживает WebGL. Попробуйте обновить браузер или включить аппаратное ускорение.</p>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
